version: "3.9"

services:
  backend:
    container_name: symon-be
    build:
      context: ./be
      dockerfile: Dockerfile
    # env_file:
    # - ./be/.env.development.local
    ports:
    - "3030:3030"
    restart: unless-stopped

  frontend:
    container_name: symon-fe
    build:
      context: ./fe
      dockerfile: Dockerfile
    # env_file:
    # - ./fe/.env
    ports:
    - "3000:3000"
    depends_on:
    - backend
    restart: unless-stopped
